name: Déployer le portfolio sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-main-root
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler le site
        run: npm run build
      - name: Préparer les fichiers servis par la branche main
        run: npm run publish:github-pages
      - name: Publier les fichiers compilés sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html index.html robots.txt sitemap.xml icons images site-assets
          if git diff --cached --quiet; then
            echo "Les fichiers publiés sont déjà à jour."
          else
            git commit -m "Publish compiled GitHub Pages site [skip ci]"
            git push origin HEAD:main
          fi
